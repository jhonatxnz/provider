services:

  mysql:
    image: 'mysql:8.4'
    environment:
      - 'MYSQL_DATABASE=provider_db'
      - 'MYSQL_USER=provider_user'
      - 'MYSQL_PASSWORD=provider_pass'
      - 'MYSQL_ROOT_PASSWORD=root'
    ports:
      - '3308:3306'

  # Note: Spring Boot's Docker Compose Support doesn't create the Kafka connection
  # automatically today (no native "service connection"), unlike MySQL.
  # The bootstrap-servers in application.yml (localhost:9092) already matches the
  # port exposed here, so no extra configuration is needed.
  kafka:
    image: 'apache/kafka:latest'
    ports:
      - '9092:9092'
    environment:
      - 'KAFKA_NODE_ID=1'
      - 'KAFKA_PROCESS_ROLES=broker,controller'
      - 'KAFKA_LISTENERS=PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093'
      - 'KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,INTERNAL://kafka:29092'
      - 'KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER'
      - 'KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093'
      - 'KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT'
      - 'KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL'
      - 'KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1'

  kafka-ui:
    image: 'provectuslabs/kafka-ui:latest'
    ports:
      - '8083:8080'
    environment:
      - 'KAFKA_CLUSTERS_0_NAME=local'
      - 'KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092'
    depends_on:
      - kafka

  prometheus:
    image: 'prom/prometheus:latest'
    ports:
      - '9090:9090'
    volumes:
      - './src/main/resources/prometheus.yml:/etc/prometheus/prometheus.yml'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  grafana:
    image: 'grafana/grafana:latest'
    ports:
      - '3000:3000'
    environment:
      - 'GF_SECURITY_ADMIN_USER=admin'
      - 'GF_SECURITY_ADMIN_PASSWORD=admin'
    volumes:
      - 'grafana-data:/var/lib/grafana'
    depends_on:
      - prometheus

volumes:
  grafana-data: