services:

  mysql:
    image: 'mysql:8.4'
    environment:
      - 'MYSQL_DATABASE=provider_db'
      - 'MYSQL_USER=provider_user'
      - 'MYSQL_PASSWORD=${MYSQL_PASSWORD}' #should be in an .env file
      - 'MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}' #should be in an .env file
    ports:
      - '3308:3306'

  kafka:
    image: 'apache/kafka:latest'
    ports:
      - '9092:9092'
    environment:
      - 'KAFKA_NODE_ID=1'
      - 'KAFKA_PROCESS_ROLES=broker,controller'
      - 'KAFKA_LISTENERS=PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093'
      - 'KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,INTERNAL://kafka:29092'
      - 'KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER'
      - 'KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093'
      - 'KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT'
      - 'KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL'
      - 'KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1'

  kafka-ui:
    image: 'provectuslabs/kafka-ui:latest'
    ports:
      - '8083:8080'
    environment:
      - 'KAFKA_CLUSTERS_0_NAME=local'
      - 'KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092'
    depends_on:
      - kafka

  prometheus:
    image: 'prom/prometheus:latest'
    ports:
      - '9090:9090'
    volumes:
      - './src/main/resources/prometheus.yml:/etc/prometheus/prometheus.yml'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  grafana:
    image: 'grafana/grafana:latest'
    ports:
      - '3000:3000'
    environment:
      - 'GF_SECURITY_ADMIN_USER=admin'
      - 'GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}' #should be in an .env file
    volumes:
      - 'grafana-data:/var/lib/grafana'
    depends_on:
      - prometheus

  opensearch:
    image: 'opensearchproject/opensearch:2.17.0'
    environment:
      - 'discovery.type=single-node'
      - 'plugins.security.disabled=true'
      - 'OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m'
      - 'OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}' #should be in an .env file
    ports:
      - '9200:9200'
    volumes:
      - 'opensearch-data:/usr/share/opensearch/data'

  opensearch-dashboards:
    image: 'opensearchproject/opensearch-dashboards:latest'
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - 'DISABLE_SECURITY_DASHBOARDS_PLUGIN=true'
    ports:
      - '5601:5601'
    depends_on:
      - opensearch

  fluent-bit:
    image: 'fluent/fluent-bit:latest'
    volumes:
      - './logs:/var/log/provider:ro'
      - './fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf'
      - './fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf'
    depends_on:
      - opensearch

volumes:
  grafana-data:
  opensearch-data: