[SERVICE]
    Flush        5
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name         tail
    Path         /var/log/provider/*.log
    Tag          provider.log
    Parser       json
    Refresh_Interval 5

[OUTPUT]
    Name              opensearch
    Match             *
    Host              opensearch
    Port              9200
    Index             provider-logs
    Suppress_Type_Name On
    tls               Off
