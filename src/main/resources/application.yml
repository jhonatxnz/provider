server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: provider

  # Docker Compose Support is disabled for now (Docker not installed yet).
  # Once you install Docker, delete this line (or set it to true) and it will
  # go back to spinning up compose.yaml (MySQL + Kafka) automatically.
  docker:
    compose:
      enabled: true

  # --- Datasource: in-memory H2, just to run without Docker/MySQL for now ---
#  datasource:
#    url: jdbc:h2:mem:provider;DB_CLOSE_DELAY=-1
#    username: sa
#    password: ""
#    driver-class-name: org.h2.Driver

  # --- Once Docker is ready, comment out the H2 block above and uncomment this one: ---
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/provider_db}
    username: ${SPRING_DATASOURCE_USERNAME:provider_user}
    password: ${SPRING_DATASOURCE_PASSWORD:provider_pass}

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # "update" is convenient in dev; switch to "validate"/"none" in production
      # and use a migration tool (Flyway/Liquibase) for the schema.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${spring.application.name}-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "br.com.jhonatan.provider.event"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:email_example@gmail.com} # environment variable configured in ide
    password: ${MAIL_PASSWORD:password_example} # environment variable configured in ide
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: info,health,metrics,prometheus
  info:
    env:
      enabled: true

info:
  app: Provider API