server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: provider

  docker:
    compose:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/provider_db}
    username: ${SPRING_DATASOURCE_USERNAME:provider_user} # environment variable configured in ide
    password: ${SPRING_DATASOURCE_PASSWORD:provider_pass} # environment variable configured in ide

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # "update" is convenient in dev; switch to "validate"/"none" in production
      # and use a migration tool (Flyway/Liquibase) for the schema.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${spring.application.name}-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "br.com.jhonatan.provider.event"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:email_example@gmail.com} # environment variable configured in ide
    password: ${MAIL_PASSWORD:password_example} # environment variable configured in ide
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: info,health,metrics,prometheus
  info:
    env:
      enabled: true

info:
  app: Provider API

security:
  jwt:
    secret: ${JWT_SECRET} # environment variable configured in ide
    expiration-ms: 3600000
  clients:
    - client-id: consumer-api
      client-secret: ${CONSUMER_CLIENT_SECRET} # environment variable configured in ide